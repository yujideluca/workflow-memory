# Limits for tools/pipeline-check (ADR-0004). Changed only by Giovanni, in a commit that says why.
# "Standard library only" and "events are append-only" are enforced by tests and by the mem.yml job `append-only`.
projeto = "workflow-memory"
aviso_a = 0.8

[gate]
command = "tools/quality_gate.sh"
required = true

[architecture]
pure_dirs = []

[[fitness]]
id = "arquivo-maior"
kind = "max_file_lines"
limit = 400
dirs = ["mem", "bin", "scripts"]
extensions = ["py"]

[[fitness]]
id = "gate-segundos"
kind = "gate_seconds"
limit = 300

[github]
repo = "yujideluca/workflow-memory"
branch = "main"
required_check = "gate"
protection_exception = "the mem job pushes derived files to main with the built-in token, which a required check rejects (simulation 2026-10-25); the local pre-push check stands in"

[dora]
days = 30
decision_log = "docs/DESIGN.md"

[pre_push]
guard = ["mem/", "bin/", "scripts/", "tests/", "tools/", "docs/", "pipeline-check", ".github/"]   # path prefixes whose change makes a push of main worth checking; [] = every push

[shellcheck]
extra_files = ["tools/hooks/pre-push"]
