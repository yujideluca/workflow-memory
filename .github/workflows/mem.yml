name: mem

# Runs on every new event (from any writer: a chat, Claude Code, a script) and once a day,
# because relevance decays with time. No machine of yours has to be on.
on:
  push:
    paths: ["events/**", "mem/**", "tests/**", ".github/workflows/mem.yml"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: mem
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Derive and publish
        run: |
          git config user.name "mem-action"
          git config user.email "mem-action@users.noreply.github.com"
          # views/, quarantine/ and promoted entries are derived from events/. Never merge derived
          # files: on a lost race, start again from the newest main and derive them again.
          for wait in 0 2 4 8 16; do
            sleep $wait
            git fetch -q origin main
            git reset -q --hard origin/main
            python -m mem quarantine
            python -m mem --instance action promote
            python -m mem build
            git add events quarantine views
            if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
            git commit -q -m "mem: quarantine, promote, views"
            git push -q && exit 0
          done
          echo "push failed" >&2; exit 1

  # Fitness function for the first invariant: an event file is never edited in place (docs/adr/0002).
  # A separate job, so a violation turns the run red without stopping the views from being rebuilt.
  # Moves to quarantine/ are renames, not edits, and are allowed.
  append-only:
    if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No event file edited in place
        run: |
          edited=$(git diff --name-only --diff-filter=M "${{ github.event.before }}" "${{ github.sha }}" -- events/)
          if [ -n "$edited" ]; then
            echo "Event files were edited in place; record a change as a new event instead (bin/mem add --supersedes ID):"
            echo "$edited"
            exit 1
          fi
          echo "append-only: ok"
