name: mem

# Runs on every new event (from any writer: a chat, Claude Code, a script) and once a day,
# because relevance decays with time. No machine of yours has to be on.
on:
  push:
    paths: ["events/**", "mem/**", "tests/**", ".github/workflows/mem.yml"]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: mem
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t .
      - name: Quarantine invalid or private events
        run: python -m mem quarantine
      - name: Promote habits seen in two projects
        run: python -m mem --instance action promote
      - name: Regenerate views
        run: python -m mem build
      - name: Commit changes
        run: |
          git config user.name "mem-action"
          git config user.email "mem-action@users.noreply.github.com"
          git add events quarantine views
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "mem: quarantine, promote, views"
          for wait in 0 2 4 8 16; do
            sleep $wait
            git pull --rebase --quiet && git push && exit 0
          done
          echo "push failed" >&2; exit 1
